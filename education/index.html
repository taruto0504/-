<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1565C0">
<meta name="description" content="医療従事者向けのレポート作成・共有・フィードバックアプリ">
<!-- アプリ化(ホーム画面に追加 / インストール)用 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="医療教育">
<title>医療教育アプリ プロトタイプ</title>
<style>
  :root{
    /* 医療系アプリらしい、清潔感のある青と白を基調にした配色 */
    --ink:#102A43;
    --ink-soft:#5B6B7F;
    --paper:#F3F6FA;
    --panel:#FFFFFF;
    --line:#DFE6EE;
    --primary:#1565C0;
    --primary-dark:#0D47A1;
    --primary-tint:#E8F0FB;
    --teal:#0E8C8C;
    --teal-tint:#E3F4F3;
    --success:#1E8E5A;
    --success-tint:#E6F5EE;
    --amber:#C77A12;
    --amber-tint:#FDF2E1;
    --danger:#C93C3C;
    --radius:14px;
    --radius-sm:10px;
    --shadow:0 1px 2px rgba(16,42,67,.05), 0 4px 14px rgba(16,42,67,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo","Segoe UI",sans-serif;
    font-feature-settings:"palt";
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:430px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .topbar{
    position:sticky; top:0; z-index:10;
    background:var(--paper);
    padding:calc(18px + env(safe-area-inset-top,0px)) 18px 10px;
    display:flex; align-items:center; gap:10px;
    border-bottom:1px solid transparent;
  }
  .topbar.bordered{border-bottom:1px solid var(--line); background:var(--panel);}
  .topbar h1{font-size:20px; font-weight:700; margin:0; letter-spacing:.01em;}
  .back-btn{
    width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
    background:var(--panel); display:flex;align-items:center;justify-content:center;
    cursor:pointer; flex-shrink:0; color:var(--ink);
  }
  .content{flex:1; padding:6px 18px 96px; min-width:0;} /* overflow を指定しない:下部固定(sticky)のボタン・入力欄が画面基準で効くように */
  .content.no-pad-top{padding-top:0;}

  /* ---- Home ---- */
  .id-card{
    background:linear-gradient(135deg,var(--primary-dark),var(--primary));
    color:#fff; border-radius:18px; padding:20px 22px; margin:6px 0 22px;
    position:relative; overflow:hidden;
  }
  .id-card::after{
    content:""; position:absolute; right:-30px; top:-40px; width:140px;height:140px;
    border-radius:50%; background:rgba(255,255,255,.08);
  }
  .id-card .role{font-size:12px; opacity:.85; letter-spacing:.04em;}
  .id-card .name{font-size:21px; font-weight:700; margin:2px 0 14px;}
  .id-card .idrow{display:flex; justify-content:space-between; align-items:flex-end;}
  .id-card .idlabel{font-size:11px; opacity:.75;}
  .id-card .idval{font-size:16px; font-weight:600; letter-spacing:.03em; font-variant-numeric: tabular-nums;}

  .actions-row{display:flex; gap:8px; margin-bottom:20px;}
  .action-btn{
    flex:1; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 8px; text-align:center; cursor:pointer; transition:transform .12s ease;
  }
  .action-btn:active{transform:scale(.97);}
  .action-btn .ic{font-size:19px;}
  .action-btn .lbl{display:block; margin-top:7px; font-size:12.5px; font-weight:700;}
  .action-btn.primary{background:var(--primary); border-color:var(--primary); color:#fff;}
  .action-btn{position:relative;}
  .action-dot{position:absolute; top:8px; right:8px; width:9px;height:9px; border-radius:50%; background:var(--amber); border:1.5px solid #fff;}

  .ad-slot{
    border:1px dashed var(--line); border-radius:var(--radius-sm); background:var(--panel);
    color:#B7BEBB; font-size:12px; font-weight:700; text-align:center;
    padding:16px; margin-bottom:16px; letter-spacing:.04em;
  }

  .section-title{font-size:13px; font-weight:700; color:var(--ink-soft); margin:22px 0 10px; letter-spacing:.02em;}

  .activity-item{
    display:flex; gap:12px; padding:13px 0; border-bottom:1px solid var(--line); cursor:pointer;
  }
  .activity-item:last-child{border-bottom:none;}
  .activity-item.compact{padding:8px 0; align-items:center;}
  .activity-item.compact .dot{margin-top:0;}
  .dot{width:8px;height:8px;border-radius:50%; margin-top:6px; flex-shrink:0;}
  .dot.unread{background:var(--amber);}
  .dot.read{background:transparent;}
  .activity-body{flex:1; min-width:0;}
  .activity-title{font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .activity-sub{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .activity-sub-inline{font-size:12px; font-weight:500; color:var(--ink-soft);}
  .activity-time{font-size:11.5px; color:#8C9793; white-space:nowrap;}

  /* ---- Buttons / inputs ---- */
  .field-label{font-size:12.5px; font-weight:700; color:var(--ink-soft); margin:18px 0 7px;}
  .req{color:var(--danger); font-weight:700; margin-left:3px;}
  input[type=text], input[type=email], input[type=password], textarea, .fake-input{
    width:100%; border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:12px 13px; font-size:14.5px; font-family:inherit; background:var(--panel); color:var(--ink);
  }
  textarea{min-height:130px; resize:vertical; line-height:1.6;}
  input[type=text]:focus, input[type=email]:focus, input[type=password]:focus, textarea:focus{outline:2px solid var(--primary); outline-offset:0; border-color:var(--primary);}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border-radius:999px; border:1px solid var(--line); background:var(--panel);
    padding:11px 18px; font-size:14px; font-weight:700; cursor:pointer; color:var(--ink);
  }
  .btn:active{transform:scale(.97);}
  .btn.solid{background:var(--primary); border-color:var(--primary); color:#fff;}
  .btn.ghost{background:transparent;}
  .btn.block{width:100%;}
  .btn.sm{padding:8px 14px; font-size:13px;}
  .btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}

  .chip{
    display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line);
    background:var(--panel); border-radius:999px; padding:7px 13px; font-size:13px; cursor:pointer;
    color:var(--ink-soft); font-weight:600; white-space:nowrap; flex-shrink:0;
  }
  .chip.active{background:var(--primary); border-color:var(--primary); color:#fff;}

  .custom-field{
    border:1px dashed var(--line); border-radius:var(--radius-sm); padding:12px; margin-top:10px;
    background:var(--panel);
  }
  .custom-field .cf-name{font-size:12px; color:var(--ink-soft); font-weight:700; margin-bottom:5px;}
  .mini-x{float:right; cursor:pointer; color:#98A2A0; font-size:13px;}

  .attach-row{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .attach-thumb{
    width:56px;height:56px; border-radius:10px; background:var(--primary-tint);
    display:flex; align-items:center; justify-content:center; font-size:18px; position:relative; color:var(--primary-dark);
  }

  .mic-btn{
    display:flex; align-items:center; gap:8px; margin-top:10px; padding:10px 14px;
    border-radius:999px; border:1px solid var(--line); background:var(--panel); cursor:pointer; font-size:13.5px; font-weight:600;
  }
  .mic-btn.recording{background:#FBEAE7; border-color:var(--danger); color:var(--danger);}
  .mic-dot{width:8px;height:8px;border-radius:50%; background:var(--danger); animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

  /* ---- Saved list ---- */
  .search-bar{
    display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line);
    border-radius:999px; padding:10px 14px; margin:6px 0 14px;
  }
  .search-bar input{border:none; padding:0; font-size:14px; flex:1;}
  .search-bar input:focus{outline:none;}
  .filter-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px;}
  .delete-actionbar{
    display:flex; align-items:center; gap:8px; background:#FBEAE7; border:1px solid var(--danger);
    border-radius:var(--radius-sm); padding:10px 14px; margin-bottom:14px; font-size:13.5px; font-weight:700; color:var(--danger);
  }

  .report-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:15px 16px; margin-bottom:11px; cursor:pointer;
  }
  .report-card:active{transform:scale(.99);}
  .rc-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .rc-title{font-size:15px; font-weight:700; line-height:1.4;}
  .badge{
    font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap; flex-shrink:0;
  }
  .badge.draft{background:#EFEDE5; color:#8A7F5B;}
  .badge.saved{background:var(--primary-tint); color:var(--primary-dark);}
  .badge.sent{background:var(--amber-tint); color:var(--amber);}
  .rc-meta{font-size:12.5px; color:var(--ink-soft); margin-top:7px; display:flex; gap:10px; align-items:center;}
  .rc-read{display:flex; align-items:center; gap:4px;}

  .empty-state{text-align:center; padding:60px 20px; color:var(--ink-soft);}
  .empty-state .em-ic{font-size:34px; margin-bottom:10px;}

  /* ---- Detail ---- */
  .tab-row{display:flex; gap:4px; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:4px; margin:4px 0 16px;}
  .tab-btn{flex:1; text-align:center; padding:9px 0; border-radius:999px; font-size:13.5px; font-weight:700; cursor:pointer; color:var(--ink-soft);}
  .tab-btn.active{background:var(--primary); color:#fff;}

  .detail-title{font-size:19px; font-weight:800; line-height:1.45; margin:4px 0 4px;}
  .detail-meta{font-size:12.5px; color:var(--ink-soft); margin-bottom:16px;}
  .detail-body{font-size:14.5px; line-height:1.85; white-space:pre-wrap; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px;}
  .cf-view{margin-top:12px; padding-top:12px; border-top:1px solid var(--line);}
  .cf-view .cfn{font-size:12px; font-weight:700; color:var(--primary-dark);}
  .cf-view .cfv{font-size:14px; margin-top:2px;}

  .read-list{display:flex; flex-direction:column; gap:10px; margin-top:6px;}
  .read-row{display:flex; align-items:center; justify-content:space-between; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-sm); padding:11px 14px;}
  .rr-name{font-size:14px; font-weight:600;}
  .rr-status{font-size:12px; font-weight:700; display:flex; align-items:center; gap:5px;}
  .rr-status.read{color:var(--primary-dark);}
  .rr-status.unread{color:var(--amber);}

  .chat-list{display:flex; flex-direction:column; gap:12px; margin-bottom:14px;}
  .msg{max-width:80%; padding:10px 13px; border-radius:14px; font-size:14px; line-height:1.55;}
  .msg.other{background:var(--panel); border:1px solid var(--line); border-bottom-left-radius:4px; align-self:flex-start;}
  .msg.me{background:var(--primary); color:#fff; border-bottom-right-radius:4px; align-self:flex-end;}
  .msg-sender{font-size:11px; font-weight:700; color:var(--ink-soft); margin-bottom:3px;}
  .msg-time{font-size:10.5px; opacity:.7; margin-top:4px; text-align:right;}
  .chat-input-row{display:flex; gap:8px; position:sticky; bottom:80px;}
  .chat-input-row input{flex:1;}

  /* ---- Send screen ---- */
  .recipient-search-results{margin-top:8px; border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden;}
  .rsr-item{padding:11px 14px; border-bottom:1px solid var(--line); font-size:14px; cursor:pointer; display:flex; justify-content:space-between; align-items:center;}
  .rsr-item:last-child{border-bottom:none;}
  .rsr-item small{color:var(--ink-soft); font-weight:600;}
  .selected-chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
  .sel-chip{display:flex; align-items:center; gap:6px; background:var(--primary-tint); color:var(--primary-dark); border-radius:999px; padding:7px 8px 7px 13px; font-size:13px; font-weight:700;}
  .sel-chip .x{cursor:pointer; width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.08); display:flex;align-items:center;justify-content:center; font-size:11px;}
  .link-note{font-size:12.5px; color:var(--ink-soft); background:var(--primary-tint); border-radius:var(--radius-sm); padding:10px 13px; margin-top:14px; display:flex; gap:8px; align-items:flex-start;}

  /* ---- Settings ---- */
  .set-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:4px 16px; margin-bottom:16px;}
  .set-row{display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--line);}
  .set-row:last-child{border-bottom:none;}
  .set-label{font-size:14.5px; font-weight:600;}
  .set-sub{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .switch{width:44px; height:26px; border-radius:999px; background:var(--line); position:relative; cursor:pointer; flex-shrink:0; transition:background .15s;}
  .switch.on{background:var(--primary);}
  .switch .knob{position:absolute; top:3px; left:3px; width:20px;height:20px; border-radius:50%; background:#fff; transition:left .15s; box-shadow:0 1px 2px rgba(0,0,0,.25);}
  .switch.on .knob{left:21px;}

  /* ---- Bottom nav ---- */
  .bottomnav{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:430px; background:var(--panel); border-top:1px solid var(--line);
    display:flex; padding:8px 6px calc(env(safe-area-inset-bottom,0px) + 8px);
    z-index:20;
  }
  .navbtn{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; cursor:pointer; color:#9AA5A1; border:none; background:none; font-family:inherit;}
  .navbtn.active{color:var(--primary-dark);}
  .navbtn .navic{font-size:19px; position:relative;}
  .nav-dot{position:absolute; top:-1px; right:-6px; width:8px; height:8px; border-radius:50%; background:var(--amber); border:1.5px solid #fff;}
  .navbtn .navlbl{font-size:10.5px; font-weight:700;}

  .toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:11px 20px; border-radius:999px; font-size:13.5px; font-weight:600; z-index:50;
    opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;
  }
  .toast.show{opacity:1;}

  /* ---- Login ---- */
  .login-wrap{padding:calc(60px + env(safe-area-inset-top,0px)) 26px 40px; text-align:center;}
  .login-logo{width:56px;height:56px;border-radius:16px;background:var(--primary); color:#fff; display:flex;align-items:center;justify-content:center; font-size:24px; font-weight:800; margin:0 auto 18px;}
  .login-wrap h2{font-size:21px; margin:0 0 6px;}
  .login-wrap p{font-size:13.5px; color:var(--ink-soft); margin:0 0 30px;}
  .login-form{text-align:left;}
  .seg{display:flex; gap:8px; margin-top:8px;}
  .seg-opt{flex:1; text-align:center; padding:10px 4px; border:1px solid var(--line); border-radius:var(--radius-sm); font-size:12.5px; font-weight:700; cursor:pointer; color:var(--ink-soft);}
  .seg-opt.active{background:var(--primary); border-color:var(--primary); color:#fff;}
  .switch-mode{margin-top:22px; text-align:center; font-size:13px; color:var(--ink-soft);}
  .switch-mode a{color:var(--primary-dark); font-weight:700; cursor:pointer; text-decoration:none;}


  /* ---- AI評価 ---- */
  .btn.ai-btn{border-color:#B9CFE8; color:#2B5C8A; background:#F1F6FC;}
  .btn:disabled{opacity:.6; cursor:default;}
  .ai-intro{font-size:13px; color:var(--ink-soft); background:#F1F6FC; border:1px solid #D6E3F2; border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:12px; line-height:1.7;}
  .ai-run{background:#2B5C8A; border-color:#2B5C8A;}
  .ai-loading{display:flex; align-items:center; gap:10px; margin-top:14px; padding:14px; border-radius:var(--radius-sm); background:var(--panel); border:1px solid var(--line); font-size:13.5px; color:var(--ink-soft);}
  .ai-spinner{width:18px; height:18px; border-radius:50%; border:3px solid #D6E3F2; border-top-color:#2B5C8A; animation:spin 1s linear infinite; flex-shrink:0;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .ai-error{margin-top:12px; padding:12px 14px; border-radius:var(--radius-sm); background:#FBEAE7; color:var(--danger); font-size:13px; line-height:1.7;}
  .ai-note{font-size:12.5px; color:#7A5A16; background:var(--amber-tint); border-radius:var(--radius-sm); padding:9px 12px; margin-bottom:10px;}
  .ai-panel{margin-top:14px; background:var(--panel); border:1px solid #D6E3F2; border-radius:var(--radius); padding:14px 16px;}
  .ai-panel-head{display:flex; align-items:center; gap:8px; font-weight:800; font-size:14px; color:#2B5C8A; margin-bottom:10px; flex-wrap:wrap;}
  .ai-panel-head a{margin-left:auto; font-size:12.5px; font-weight:700; color:var(--ink-soft); cursor:pointer;}
  .ai-panel-head small{margin-left:auto; font-size:11.5px; font-weight:600; color:var(--ink-soft);}
  .ai-sec{padding:10px 0; border-top:1px solid var(--line);}
  .ai-sec:first-of-type{border-top:none; padding-top:0;}
  .ai-h{font-size:13px; font-weight:800; margin-bottom:6px;}
  .ai-text{font-size:13.5px; line-height:1.75; white-space:pre-wrap;}
  .ai-text.muted{color:var(--ink-soft);}
  .ai-overall{margin-bottom:6px;}
  .ai-tag{display:inline-block; font-size:11.5px; font-weight:800; padding:2px 9px; border-radius:999px; white-space:nowrap;}
  .ai-tag.sm{font-size:10.5px; padding:1px 7px; font-weight:700;}
  .ai-tag.good{background:var(--primary-tint); color:var(--primary-dark);}
  .ai-tag.fair{background:var(--amber-tint); color:#8A5B12;}
  .ai-tag.bad{background:#FBEAE7; color:var(--danger);}
  .ai-tag.muted{background:#EEF1EF; color:var(--ink-soft);}
  .ai-claim{padding:8px 0;}
  .ai-claim + .ai-claim{border-top:1px dashed var(--line);}
  .ai-claim-top{display:flex; gap:8px; align-items:flex-start; margin-bottom:3px;}
  .ai-claim-st{font-size:13.5px; font-weight:700; line-height:1.5;}
  .ai-fix{font-size:13px; color:var(--primary-dark); background:var(--primary-tint); border-radius:8px; padding:6px 10px; margin-top:5px; line-height:1.6;}
  .ai-list{margin:4px 0 0; padding-left:20px; font-size:13.5px; line-height:1.75;}
  .ai-list li{margin-bottom:6px;}
  .ai-disclaimer{font-size:11.5px; color:var(--ink-soft); border-top:1px solid var(--line); padding-top:10px; margin-top:4px; line-height:1.7;}
  .action-count{position:absolute; top:6px; right:8px; min-width:18px; height:18px; padding:0 5px; border-radius:999px; background:var(--amber); color:#fff; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center;}
  .badge.received{background:#E8F0FA; color:#2B5C8A;}
  .tab-dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--amber); vertical-align:middle;}
  .tab-btn{white-space:nowrap;}

  /* ---- 作成画面の固定ボタン ---- */
  .create-actions{
    position:sticky; bottom:calc(72px + env(safe-area-inset-bottom,0px)); z-index:5;
    display:flex; gap:8px; align-items:center; margin:18px -18px 0; padding:10px 18px;
    background:rgba(243,245,242,.96); border-top:1px solid var(--line); backdrop-filter:blur(6px);
  }
  .create-actions .send{flex:1; min-width:96px;}
  .create-actions .btn{white-space:nowrap; height:40px; padding-top:0; padding-bottom:0;}
  .mic-btn{display:inline-flex; font-size:13px; padding:8px 14px;}
  .welcome{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; margin-bottom:6px;}
  .welcome-h{font-weight:800; font-size:14px; margin-bottom:6px;}
  .welcome ol{margin:0; padding-left:20px; font-size:13px; line-height:1.9; color:var(--ink-soft);}
  .ai-source{font-size:12.5px; color:var(--ink-soft); background:#EEF1EF; border-radius:8px; padding:8px 11px; margin-bottom:10px; line-height:1.6;}
  .ai-source.ok{background:#E8F0FA; color:#2B5C8A;}

<script>
/* ============ Data (Firestoreと連携) ============ */
const ME = { uid:null, id:'-', name:'-', occupation:'-', emailVerified:false };

// 検索・送信先の候補(Firestoreのusersコレクションから読み込む)
let DIRECTORY = [];

// レポート一覧(Firestoreから読み込んでここに入れる。ログイン前は空)
let reports = [];

/* ============ App State ============ */
const S = {
  screen:'login',
  authMode:'login', // login | register
  occSel:'医師',
  currentId:null,
  detailTab:'content', // content | read | chat
  filterStatus:'all',
  deleteMode:false,
  deleteSelected:[],
  filterQuery:'',
  draft:null,     // report being created/edited
  recording:false,
  sendSelected:[], // contact ids
  sendQuery:'',
  sendMode:'search', // search | saved
  myContacts:[],
  addContactInput:'',
  contactEditMode:false,
  contactSelected:[],
  notif:{ push:true, sound:true, quiet:false },
  aiDraft:{ loading:false, result:null, error:'' }, // 作成画面のAI評価(保存しない)
  aiBusy:false,       // 詳細画面でAI評価を実行中のレポートID(実行中でなければ false)
  aiError:'',
  plan:null,          // 料金プラン(サーバーの getMyPlan の結果)
  aiReview:null,      // 詳細画面に表示する最新のAI評価
  aiReviewLoaded:false,
};

/* ============ 端末の判定 ============ */
// 画面レイアウトはCSSのメディアクエリで自動的に切り替わる。ここでは操作方法の違い(マウスかタッチか)を判定する
const IS_DESKTOP = window.matchMedia('(hover:hover) and (pointer:fine)').matches;
const HAS_SPEECH = !!(window.SpeechRecognition || window.webkitSpeechRecognition); // 音声入力に対応していない端末ではボタンを出さない
const IS_STANDALONE = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; // インストール済みアプリとして起動中か
const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
// Enterキー判定(日本語入力の変換確定のEnterでは反応しない)
function isEnter(e){ return e.key==='Enter' && !e.isComposing && e.keyCode!==229 && !e.shiftKey; }

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),300); }, 1800);
}

function newDraft(){
  return { id:null, title:'', body:'', question:'', fields:[], status:'draft', createdAt:'今日', originalId:null, recipients:[], comments:[] };
}

/* ============ Firestore データ読み込み ============ */
/* ---- レポート一覧のリアルタイム監視 ---- */
let unsubAuthoredReports = null;
let unsubReceivedReports = null;
let authoredMap = {};
let receivedMap = {};

function startReportsListener(){
  stopReportsListener();
  if(!window.fb || !ME.uid) return;
  unsubAuthoredReports = window.fb.onSnapshot(
    window.fb.query(window.fb.collection(window.fb.db,'reports'), window.fb.where('authorUid','==',ME.uid)),
    (snap)=>{
      authoredMap = {};
      // serverTimestamps:'estimate' … 保存直後(サーバー時刻の確定前)も日時を表示し、並び順を正しくする
      snap.forEach(d=> authoredMap[d.id] = fromFirestoreReport(d.id, d.data({serverTimestamps:'estimate'})));
      mergeAndRenderReports();
    },
    (err)=>{ console.error(err); }
  );
  unsubReceivedReports = window.fb.onSnapshot(
    window.fb.query(window.fb.collection(window.fb.db,'reports'), window.fb.where('recipientIdList','array-contains',ME.id)),
    (snap)=>{
      receivedMap = {};
      snap.forEach(d=> receivedMap[d.id] = fromFirestoreReport(d.id, d.data({serverTimestamps:'estimate'})));
      mergeAndRenderReports();
    },
    (err)=>{ console.error(err); }
  );
}
function stopReportsListener(){
  if(unsubAuthoredReports){ unsubAuthoredReports(); unsubAuthoredReports=null; }
  if(unsubReceivedReports){ unsubReceivedReports(); unsubReceivedReports=null; }
  authoredMap = {}; receivedMap = {};
}
function mergeAndRenderReports(){
  const map = Object.assign({}, authoredMap, receivedMap);
  reports = Object.values(map).sort((a,b)=> (b._ts||0) - (a._ts||0));
  // ホーム・保存済み一覧・詳細画面を見ているときだけ再描画(他画面での入力を邪魔しないため)
  // 検索欄に入力中なら一覧部分だけを差し替えて、フォーカスとIME変換を保つ
  if(S.screen==='saved' && document.activeElement && document.activeElement.id==='saved-search') renderSavedList();
  else if(['home','saved','detail'].includes(S.screen)) render();
}

function fromFirestoreReport(id, data){
  const recipientsArr = Object.keys(data.recipients||{}).map(pid=>({ id:pid, read: !!data.recipients[pid].read, name: data.recipients[pid].name }));
  const ts = data.createdAt && data.createdAt.toMillis ? data.createdAt.toMillis() : (data.createdAtMs||0);
  const lastCommentAt = data.lastCommentAt && data.lastCommentAt.toMillis ? data.lastCommentAt.toMillis() : 0;
  const myReadAt = data.commentReads && data.commentReads[ME.uid] && data.commentReads[ME.uid].toMillis ? data.commentReads[ME.uid].toMillis() : 0;
  const hasUnreadComment = !!lastCommentAt && lastCommentAt > myReadAt && data.lastCommentByUid !== ME.uid;
  return {
    id, title:data.title||'', body:data.body||'', question:data.question||'',
    fields: data.fields||[], attachments: data.attachments||[], status: data.status||'draft',
    createdAt: ts ? new Date(ts).toLocaleDateString('ja-JP', {month:'2-digit', day:'2-digit'}) : '下書き',
    originalId: data.originalId||null,
    authorUid: data.authorUid, authorId: data.authorId, authorName: data.authorName,
    recipients: recipientsArr, comments: [], _ts: ts,
    lastCommentAt, hasUnreadComment,
  };
}

function render(){
  const app = document.getElementById('app');
  let html = '';
  if(S.screen==='login') html = screenLogin();
  else if(S.screen==='home') html = wrap(screenHome(), 'home');
  else if(S.screen==='create') html = wrap(screenCreate(), 'create');
  else if(S.screen==='saved') html = wrap(screenSaved(), 'saved');
  else if(S.screen==='detail') html = wrap(screenDetail(), 'saved');
  else if(S.screen==='send') html = wrap(screenSend(), 'create');
  else if(S.screen==='settings') html = wrap(screenSettings(), 'settings');
  else if(S.screen==='contacts') html = wrap(screenContacts(), 'home');
  else if(S.screen==='plan') html = wrap(screenPlan(), 'settings');
  else if(S.screen==='terms') html = screenLegal('terms');
  else if(S.screen==='privacy') html = screenLegal('privacy');
  // 相手のコメント受信などで再描画されても、入力途中のコメントが消えないようにする
  const chat = document.getElementById('chatInput');
  const chatState = chat ? { value:chat.value, focused: document.activeElement===chat } : null;
  app.innerHTML = html;
  // メニューがある画面だけ、パソコン表示で左側にメニュー分の余白を取る
  app.classList.toggle('has-nav', !!app.querySelector('.bottomnav'));
  const chatAfter = document.getElementById('chatInput');
  if(chatState && chatAfter){
    chatAfter.value = chatState.value;
    if(chatState.focused) chatAfter.focus();
  }
  // 画面そのものが切り替わったときだけ一番上に戻す(同じ画面内の再描画では今のスクロール位置を保つ)
  if(_lastRenderedScreen !== S.screen){
    window.scrollTo(0,0);
    _lastRenderedScreen = S.screen;
  }
}

function makePersonalId(occupation, uid){
  // 何らかの理由でmakeUniquePersonalIdが使えなかった場合のフォールバック用(通常は使用されない)
  const prefix = {'医師':'DR','看護師':'NR','救急救命士':'EMT'}[occupation] || 'ID';
  return prefix + '-' + (uid||'0000').slice(0,4).toUpperCase();
}

// 新規登録時に使う、衝突しない個人IDの発行(Firestoreのカウンターをトランザクションでアトミックに+1する)
// 同じトランザクションで personalIds/{ID} に「このIDは自分のもの」という記録を作る。
// セキュリティルールはこの記録を使って、他人の個人IDを名乗れないようにしている。
async function makeUniquePersonalId(occupation, uid){
  const prefix = {'医師':'DR','看護師':'NR','救急救命士':'EMT'}[occupation] || 'ID';
  const counterRef = window.fb.doc(window.fb.db, 'counters', prefix);
  return await window.fb.runTransaction(window.fb.db, async (tx)=>{
    const snap = await tx.get(counterRef);
    const value = (snap.exists() ? snap.data().value : 0) + 1;
    const personalId = prefix + '-' + String(value).padStart(4,'0'); // 例: DR-0001, DR-0002...
    tx.set(counterRef, { value });
    tx.set(window.fb.doc(window.fb.db, 'personalIds', personalId), { uid });
    return personalId;
  });
}

}

function applyAuthUser(user, fallback){
  let name = fallback && fallback.name, occupation = fallback && fallback.occupation, id = fallback && fallback.id;
  if(!name && user.displayName){
    const parts = user.displayName.split('|');
    if(parts.length===3){ name=parts[0]; occupation=parts[1]; id=parts[2]; }
  }
  ME.uid = user.uid;
  ME.name = name || (user.email||'').split('@')[0];
  ME.occupation = occupation || '(未設定)';
  ME.id = id || makePersonalId('', user.uid);
  ME.emailVerified = !!user.emailVerified;
  startReportsListener(); // ログインしたら、レポートのリアルタイム監視を開始する
  loadMyPlan();           // 料金プランと今日の利用状況を取得する
}

async function doLogin(){
  if(!window.fb){ toast('Firebaseの読み込み中です。少し待ってから再度お試しください'); return; }
  const btn = document.getElementById('auth-submit-btn');
  const originalLabel = btn.textContent;

  if(S.authMode==='register'){
    const name = (document.getElementById('rg-name').value||'').trim();
    const email = (document.getElementById('rg-email').value||'').trim();
    const password = document.getElementById('rg-password').value||'';
    const agreed = document.getElementById('rg-agree') && document.getElementById('rg-agree').checked;
    if(!name || !email || !password){ toast('氏名・メールアドレス・パスワードを入力してください'); return; }
    if(!agreed){ toast('利用規約とプライバシーポリシーへの同意が必要です'); return; }
    if(name.length > 50){ toast('氏名は50文字以内で入力してください'); return; }
    btn.textContent = '登録中…';
    btn.disabled = true;
    authInProgress = true; // 登録が終わるまで onAuthStateChanged 側の処理を止める(プロフィール未作成のまま進まないように)
    let cred = null;
    try{
      cred = await window.fb.createUserWithEmailAndPassword(window.fb.auth, email, password);
      const personalId = await makeUniquePersonalId(S.occSel, cred.user.uid);
      await window.fb.updateProfile(cred.user, { displayName: `${name}|${S.occSel}|${personalId}` });
      // Firestoreにプロフィールを保存(他の人から検索・送信できるようにするため)
      // メールアドレスは全ユーザーから読める users には保存しない(Firebase Authenticationが保持している)
      await window.fb.setDoc(window.fb.doc(window.fb.db, 'users', cred.user.uid), {
        name, occupation: S.occSel, personalId, createdAt: Date.now(), agreedTermsAt: Date.now()
      });
      applyAuthUser(cred.user, {name, occupation:S.occSel, id:personalId});
      try{ await window.fb.sendEmailVerification(cred.user); }catch(e){ console.error(e); }
      toast('個人ID「'+personalId+'」を発行しました。確認メールも送信しましたのでご確認ください');
      authInProgress = false;
      go('home');
    }catch(e){
      console.error(e);
      // アカウントだけ作られてプロフィールが無い中途半端な状態を残さない(同じメールで再登録できるように)
      if(cred && cred.user){ try{ await window.fb.deleteUser(cred.user); }catch(e2){ console.error(e2); } }
      authInProgress = false;
      toast(authErrorMessage(e));
      btn.textContent = originalLabel;
      btn.disabled = false;
    }
  } else {
    const email = (document.getElementById('li-email').value||'').trim();
    const password = document.getElementById('li-password').value||'';
    if(!email || !password){ toast('メールアドレスとパスワードを入力してください'); return; }
    btn.textContent = 'ログイン中…';
    btn.disabled = true;
    authInProgress = true;
    try{
      const cred = await window.fb.signInWithEmailAndPassword(window.fb.auth, email, password);
      await loadProfileAndApply(cred.user);
      authInProgress = false;
      go('home');
    }catch(e){
      authInProgress = false;
      toast(authErrorMessage(e));
      btn.textContent = originalLabel;
      btn.disabled = false;
    }
  }
}
let authInProgress = false;

// Firestoreからプロフィール(氏名・職種・個人ID)を取得してMEに反映する
async function loadProfileAndApply(user){
  if(!user.emailVerified){ try{ await user.reload(); }catch(e){} } // メールのリンクで確認済みにした直後でも反映する
  try{
    const snap = await window.fb.getDoc(window.fb.doc(window.fb.db, 'users', user.uid));
    if(snap.exists()){
      const data = snap.data();
      applyAuthUser(user, { name:data.name, occupation:data.occupation, id:data.personalId });
    } else {
      applyAuthUser(user); // 万が一Firestoreにまだ記録がない場合はdisplayNameから復元
    }
  }catch(e){
    applyAuthUser(user);
  }
}

async function deleteAccount(){
  if(!window.fb || !window.fb.auth.currentUser) return;
  const pwInput = document.getElementById('acct-current-pw');
  if(!pwInput || !pwInput.value){ toast('上の「現在のパスワード」欄にパスワードを入力してから削除してください'); if(pwInput) pwInput.focus(); return; }
  const ok = window.confirm('本当にアカウントを削除しますか?この操作は取り消せません。');
  if(!ok) return;
  const user = window.fb.auth.currentUser;
  try{
    // 先に再認証しておく。これで deleteUser が「再ログインが必要」で失敗し、
    // プロフィールだけ消えた壊れたアカウントが残る、ということが起きなくなる
    await reauth();
    stopReportsListener();
    await window.fb.deleteDoc(window.fb.doc(window.fb.db, 'users', user.uid));
    await window.fb.deleteUser(user);
    toast('アカウントを削除しました');
    ME.uid = null; ME.name = '-'; ME.occupation = '-'; ME.id = '-';
    reports = []; DIRECTORY = [];
    S.screen = 'login';
    render();
  }catch(e){
    if(e.code === 'auth/requires-recent-login'){
      toast('セキュリティのため、再ログインしてからもう一度お試しください');
      await doLogout();
    } else if(e.code && e.code.startsWith('auth/')){
      startReportsListener();
      toast(authErrorMessage(e));
    } else {
      console.error(e);
      toast('削除に失敗しました(' + (e.code || e.message) + ')');
    }
  }
}

async function resendVerificationEmail(){

// 現在のパスワードで再認証してから、メール/パスワードの変更を許可する
async function reauth(){
  const pwInput = document.getElementById('acct-current-pw');
  const currentPw = pwInput ? pwInput.value : '';
  if(!currentPw){ toast('現在のパスワードを入力してください'); return false; }
  const user = window.fb.auth.currentUser;
  const cred = window.fb.EmailAuthProvider.credential(user.email, currentPw);
  await window.fb.reauthenticateWithCredential(user, cred);
  return true;
}

async function changeEmail(){
  if(!window.fb || !window.fb.auth.currentUser) return;
  const newEmail = (document.getElementById('acct-new-email').value||'').trim();
  if(!newEmail){ toast('新しいメールアドレスを入力してください'); return; }
  try{
    const ok = await reauth();
    if(!ok) return;
    await window.fb.verifyBeforeUpdateEmail(window.fb.auth.currentUser, newEmail);
    toast(newEmail + ' 宛に確認メールを送信しました。リンクを開くと変更が完了します');
  }catch(e){
    toast(authErrorMessage(e));
  }
}

async function changePassword(){
  if(!window.fb || !window.fb.auth.currentUser) return;
  const newPw = document.getElementById('acct-new-pw').value||'';
  if(!newPw || newPw.length<6){ toast('パスワードは6文字以上にしてください'); return; }
  try{
    const ok = await reauth();
    if(!ok) return;
    await window.fb.updatePassword(window.fb.auth.currentUser, newPw);
    document.getElementById('acct-new-pw').value = '';
    document.getElementById('acct-current-pw').value = '';
    toast('パスワードを変更しました');
  }catch(e){
    toast(authErrorMessage(e));
  }
}

let speechRecognizer = null;
let micSafetyTimer = null;
function toggleMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    toast('お使いのブラウザは音声入力に対応していません(Android版Chromeを推奨します)');
    return;
  }
  if(S.recording){
    stopMic();
    return;
  }
  try{
    speechRecognizer = new SR();
  }catch(e){
    toast('音声認識を開始できませんでした');
    return;
  }
  speechRecognizer.lang = 'ja-JP';
  speechRecognizer.continuous = false;   // 1文ずつ認識する安定モード(継続モードは固まりやすいため)
  speechRecognizer.interimResults = false;
  speechRecognizer.maxAlternatives = 1;

  speechRecognizer.onresult = (event)=>{
    let text = '';
    for(let i=0; i<event.results.length; i++){
      if(event.results[i].isFinal){ text += event.results[i][0].transcript; }
    }
    if(text && S.draft){
      S.draft.body += (S.draft.body ? '\n' : '') + text;
      const ta = document.getElementById('f-body');
      if(ta) ta.value = S.draft.body;
    }
  };
  speechRecognizer.onerror = (event)=>{
    if(event.error === 'not-allowed'){ toast('マイクの使用が許可されていません。ブラウザの設定を確認してください'); stopMic(); }
    else if(event.error !== 'no-speech' && event.error !== 'aborted'){ toast('音声認識でエラーが発生しました('+event.error+')'); stopMic(); }
  };
  speechRecognizer.onend = ()=>{
    stopMic();
  };
  S.recording = true;
  render();
  toast('聞き取り中です。話し終えると自動で反映されます(もう一度タップでも終了できます)');
  try{
    speechRecognizer.start();
  }catch(e){
    stopMic();
    toast('音声認識を開始できませんでした');
    return;
  }
  // 8秒たっても終わらない場合は強制的に元に戻す(固まり対策)
  micSafetyTimer = setTimeout(()=>{ stopMic(); }, 8000);
}
function stopMic(){
  if(micSafetyTimer){ clearTimeout(micSafetyTimer); micSafetyTimer=null; }
  if(speechRecognizer){
    try{ speechRecognizer.onend=null; speechRecognizer.onerror=null; speechRecognizer.stop(); }catch(e){}
    speechRecognizer = null;
  }
  if(S.recording){ S.recording = false; render(); }
}

function addAttachment(){
  const d = S.draft; // アップロード中に画面を移動しても、この下書きに添付する
  d.attachments = d.attachments||[];
  const maxAtt = currentPlan().maxAttachments;
  if(d.attachments.length>=maxAtt){ toast(limitMessage(`画像の添付は${maxAtt}枚までです`, 'maxAttachments')); return; }
  if(!window.fb || !ME.uid){ toast('ログイン状態を確認してください'); return; }
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async ()=>{
    const file = input.files[0];
    if(!file) return;
    if(file.size > 8*1024*1024){ toast('8MB以下の画像を選んでください'); return; }
    toast('アップロード中…');
    try{
      const path = `attachments/${ME.uid}/${Date.now()}_${file.name.replace(/[^\w.\-]/g,'_')}`;
      const storageRef = window.fb.ref(window.fb.storage, path);
      await window.fb.uploadBytes(storageRef, file);
      const url = await window.fb.getDownloadURL(storageRef);
      d.attachments.push({ url, name:file.name, path });
      toast('画像を添付しました');

    }catch(e){

async function removeAttachment(i){
  const d = S.draft;
  const a = (d.attachments||[])[i];
  if(!a) return;
  d.attachments.splice(i,1);
  render();
  // 保存済みのレポート(このレポート自身の保存版や、再編集元のレポート)が参照している画像は、
  // ここでは消さない。保存し直したときに persistDraft が不要になった分を片付ける。
  // どこからも参照されていない(アップロードしたばかりの)画像だけをすぐ削除する。
  if(a.path && window.fb && !isPathReferenced(a.path, null)){
    try{ await window.fb.deleteObject(window.fb.ref(window.fb.storage, a.path)); }catch(e){ console.error(e); }
  }
}
// 自分のフォルダにあり、どのレポートからも参照されていない画像だけを削除する
async function deleteUnreferencedAttachments(paths, exceptId){
  if(!window.fb) return;
  for(const path of paths){
    if(!path || !path.startsWith(`attachments/${ME.uid}/`)) continue;
    if(isPathReferenced(path, exceptId)) continue;
    try{ await window.fb.deleteObject(window.fb.ref(window.fb.storage, path)); }catch(e){ console.error(e); }
  }
}

// 下書き・保存の内容をFirestoreに書き込む(新規なら作成、既存なら更新)。成功時true、失敗時falseを返す
async function persistDraft(d){
  if(!window.fb || !ME.uid){ toast('ログイン状態を確認できません。再読み込みしてからお試しください'); return false; }
  const payload = {
    title:d.title, body:d.body, question:d.question||'', fields:d.fields||[],
    attachments: (d.attachments||[]).map(a=>({url:a.url, name:a.name, path:a.path})),
    status:d.status, originalId:d.originalId||null,
    authorUid: ME.uid, authorId: ME.id, authorName: ME.name,
    recipients: d.recipients && d.recipients.length ? Object.fromEntries(d.recipients.map(r=>[r.id,{read:!!r.read,name:(DIRECTORY.find(x=>x.id===r.id)||{}).name||r.id}])) : {},
    recipientIdList: (d.recipients||[]).map(r=>r.id),
  };
  try{
    if(d.id){
      // 既存ドキュメントの更新時は作成日時を上書きしない
      const before = findReport(d.id);
      const removedPaths = before
        ? (before.attachments||[]).map(a=>a.path).filter(p=>p && !payload.attachments.some(a=>a.path===p))
        : [];
      await window.fb.updateDoc(window.fb.doc(window.fb.db,'reports', d.id), payload);
      // 保存し直して外れた画像を、他のレポート(再編集元など)が使っていなければ削除する
      if(removedPaths.length) deleteUnreferencedAttachments(removedPaths, d.id);
    } else {
      payload.createdAt = window.fb.serverTimestamp();
      const ref = await window.fb.addDoc(window.fb.collection(window.fb.db,'reports'), payload);
      d.id = ref.id;
    }
    return true;
  }catch(e){
    console.error(e);
    toast('保存に失敗しました(' + (e.code || e.message) + ')。もう一度お試しください');
    return false;
  }
}

// サーバー側(Cloud Functions の evaluateReport)が Claude を呼び出して評価する。APIキーはブラウザに置かない
function callAiEvaluate(payload){

// プランの上限によるエラーか(アップグレードの案内を出す)
function isPlanLimitError(e){
  const reason = e && e.details && e.details.reason;
  return reason==='upgrade_required' || (reason==='daily_limit' && isFreePlan());
}
function aiErrorHtml(msg, upgrade){
  return `<div class="ai-error">⚠️ ${escapeHtml(msg)}
    ${upgrade ? `<div style="margin-top:8px;"><button class="btn sm" onclick="go('plan')">プランを見る ›</button></div>` : ''}</div>`;
}
function aiLockedHtml(){
  return `<div class="ai-note">🔒 ${aiRemainingText()}。<a style="font-weight:700; cursor:pointer;" onclick="go('plan')">プランを見る ›</a></div>`;
}
function aiErrorMessage(e){
  const code = String(e && e.code || '').replace('functions/','');
  const msg = String(e && e.message || '');
  if(/[ぁ-んァ-ヶ一-龠]/.test(msg)) return msg; // サーバーが日本語で理由を返している場合はそのまま表示
  if(code==='not-found') return 'AI評価の機能がまだサーバーに設定されていません(管理者向け:Cloud Functions のデプロイが必要です)';
  if(code==='unauthenticated') return 'AI評価を利用できませんでした。ログインし直してからお試しください(App Check の設定が必要な場合があります)';
  if(code==='deadline-exceeded') return 'AIの応答に時間がかかりすぎました。少し時間をおいてお試しください';
  if(code==='unavailable') return '通信に失敗しました。回線状況を確認してください';
  return 'AI評価に失敗しました(' + (code || 'unknown') + ')';
}

// 作成画面:保存前の内容をそのまま評価する(結果は保存しない)
async function aiEvaluateDraft(){
  const d = S.draft;
  if(!d || !d.title || !d.body){ toast('タイトルと本文を入力してから評価してください'); return; }
  if(S.aiDraft.loading) return;
  if(!aiConfirm()) return;
  const snapshot = draftSnapshot(d);
  S.aiDraft = { loading:true, result:null, error:'' };
  render();
  try{
    const data = await callAiEvaluate({ draft: JSON.parse(snapshot) });
    S.aiDraft = { loading:false, result:{ review:data.review, at:Date.now() }, error:'', snapshot };
    if(typeof data.remaining==='number') toast('AI評価が完了しました(今日はあと' + data.remaining + '回)');
  }catch(e){
    console.error(e);
    S.aiDraft = { loading:false, result:null, error: aiErrorMessage(e), upgrade: isPlanLimitError(e) };
    if(e && e.details && e.details.reason==='daily_limit' && S.plan && S.plan.usage) S.plan.usage.aiRemainingToday = 0;
  }
  if(S.screen==='create' && S.draft===d) render();
}

async function aiEvaluateReport(id){
  if(S.aiBusy) return;
  if(!aiConfirm()) return;
  S.aiBusy = id; S.aiError = ''; // 評価中のレポートID

  render();
  try{
    const data = await callAiEvaluate({ reportId:id });
    // 保存された結果はリアルタイム監視でも届くが、待たずにすぐ表示する
    if(S.currentId===id) S.aiReview = { id:data.reviewId, review:data.review, requestedByName:ME.name, createdAt:null };
    if(typeof data.remaining==='number') toast('AI評価が完了しました(今日はあと' + data.remaining + '回)');
  }catch(e){
    console.error(e);
    S.aiError = aiErrorMessage(e);
    S.aiErrorUpgrade = isPlanLimitError(e);
    if(e && e.details && e.details.reason==='daily_limit' && S.plan && S.plan.usage) S.plan.usage.aiRemainingToday = 0;
  }
  S.aiBusy = false;
  if(S.screen==='detail') render();
}

function safeLink(u){ const s = String(u||''); return /^https:\/\/[^\s"'<>]+$/.test(s) ? escapeHtml(s) : ''; }
function shortUrl(u){ try{ const x = new URL(u); return x.hostname.replace(/^www\./,''); }catch(e){ return ''; } }
// Minds のサイト内を検索する(Google のサイト内検索を使う)
function mindsSearchUrl(k){ return 'https://www.google.com/search?q=' + encodeURIComponent('site:minds.jcqhc.or.jp ' + k); }
function renderAiReview(rv){
  rv = rv || {};
  const arr = (v)=>Array.isArray(v) ? v : [];
  const LEVEL = { good:['✅ おおむね適切','good'], fair:['⚠️ 一部に確認が必要','fair'], needs_work:['❗ 修正が必要な点あり','bad'] };
  const VERDICT = { correct:['正しい','good'], partly_correct:['一部不正確','fair'], incorrect:['誤りの可能性','bad'], unverifiable:['確認できず','muted'] };
  const CONF = { high:['確信度:高','good'], medium:['確信度:中','fair'], low:['確信度:低(要確認)','muted'] };
  const overall = rv.overall || {};
  const lv = LEVEL[overall.level] || ['評価','muted'];
  const claims = arr(rv.claims), sugg = arr(rv.suggestions), refs = arr(rv.references);
  const ev = rv.evidence || {};
  const gs = rv.guideline_search || {};
  return `
    ${rv.privacy_warning ? `<div class="ai-error">🔒 個人情報の注意:${escapeHtml(rv.privacy_warning)}</div>` : ''}
    ${gs.status==='ok' ? `<div class="ai-source ok">🌐 Minds など信頼できる医療サイトのガイドラインを検索して評価しました${gs.found_count ? `(参照 ${Number(gs.found_count)||0} 件)` : ''}</div>`
      : gs.status==='failed' ? `<div class="ai-source">📖 今回はネット検索ができなかったため、AIの知識だけで評価しています</div>` : ''}
    <div class="ai-sec">
      <div class="ai-overall"><span class="ai-tag ${lv[1]}">${lv[0]}</span></div>
      <div class="ai-text">${escapeHtml(overall.summary)}</div>
    </div>
    <div class="ai-sec">
      <div class="ai-h">${ic('check')}根拠の正しさ</div>
      ${claims.length ? claims.map(c=>{ const v = VERDICT[c.verdict] || ['—','muted']; return `
        <div class="ai-claim">
          <div class="ai-claim-top"><span class="ai-tag ${v[1]}">${v[0]}</span><span class="ai-claim-st">${escapeHtml(c.statement)}</span></div>
          <div class="ai-text">${escapeHtml(c.explanation)}</div>
          ${c.correction ? `<div class="ai-fix">➡ ${escapeHtml(c.correction)}</div>` : ''}
        </div>`; }).join('') : `<div class="ai-text muted">判定できる医学的な記述は見つかりませんでした</div>`}
    </div>
    <div class="ai-sec">
      <div class="ai-h">${ic('shield')}根拠・出典の示し方</div>
      <div class="ai-text">${escapeHtml(ev.assessment)}</div>
      ${arr(ev.issues).length ? `<ul class="ai-list">${arr(ev.issues).map(i=>`<li>${escapeHtml(i)}</li>`).join('')}</ul>` : ''}
    </div>
    ${sugg.length ? `<div class="ai-sec">
      <div class="ai-h">${ic('bulb')}提案</div>
      <ul class="ai-list">${sugg.map(x=>`<li><b>${escapeHtml(x.point)}</b><br>${escapeHtml(x.detail)}</li>`).join('')}</ul>
    </div>` : ''}
    ${refs.length ? `<div class="ai-sec">
      <div class="ai-h">${ic('book')}参考資料</div>
      <ul class="ai-list">${refs.map(x=>{
        const cf = CONF[x.confidence] || ['','muted'];
        const link = x.verified ? safeLink(x.url) : '';
        return `<li><b>${escapeHtml(x.title)}</b>${x.publisher ? `(${escapeHtml(x.publisher)})` : ''}
          ${link ? `<span class="ai-tag sm good">🌐 Webで確認</span>` : `<span class="ai-tag sm ${cf[1]}">${cf[0]}</span>`}
          <br>${escapeHtml(x.note)}
          ${link ? `<br><a class="ai-link" href="${link}" target="_blank" rel="noopener noreferrer">🔗 ${escapeHtml(shortUrl(x.url))} を開く</a>` : ''}</li>`;
      }).join('')}</ul>
    </div>` : ''}
    <div class="ai-sec">
      <div class="ai-h">${ic('search')}関連ガイドラインを探す</div>
      <div class="ai-search-links">
        ${arr(rv.search_keywords).map(k=>`<a class="chip" href="${mindsSearchUrl(k)}" target="_blank" rel="noopener noreferrer">${escapeHtml(k)}</a>`).join('')}
        <a class="chip" href="https://minds.jcqhc.or.jp/" target="_blank" rel="noopener noreferrer">Minds ガイドラインライブラリ ›</a>
      </div>
    </div>
    ${rv.question_answer ? `<div class="ai-sec">
      <div class="ai-h">${ic('help')}疑問・困りごとへの回答</div>
      <div class="ai-text">${escapeHtml(rv.question_answer)}</div>
    </div>` : ''}
    <div class="ai-disclaimer">※ AIによる参考評価です。誤りを含むことがあります。診療上の判断には使わず、必ずガイドラインの原典や指導者に確認してください。参考資料は、実在するか・最新版かを必ず確認してください。</div>
  `;
}

async function sendComment(id){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text || !window.fb) return;
  input.value = '';
  try{
    await window.fb.addDoc(window.fb.collection(window.fb.db,'reports',id,'comments'), {
      senderUid: ME.uid, senderName: ME.name, text, createdAt: window.fb.serverTimestamp()
    });
  }catch(e){
    console.error(e);
    // 失敗したら入力内容を戻して、打ち直さなくて済むようにする
    const again = document.getElementById('chatInput');
    if(again && !again.value) again.value = text;
    toast('送信に失敗しました');
    return;
  }
  // コメント自体は送れている。相手が「返信が来た」と気づけるように、レポート側に最終コメント日時を記録する
  // (ここで失敗してもコメントは届いているので、入力欄には戻さない=二重送信を防ぐ)
  try{
    await window.fb.updateDoc(window.fb.doc(window.fb.db,'reports', id), {
      lastCommentAt: window.fb.serverTimestamp(),
      lastCommentByUid: ME.uid,
      [`commentReads.${ME.uid}`]: window.fb.serverTimestamp()
    });
  }catch(e){ console.error(e); }
  toast('送信しました');
}
// レポートをFirestoreから削除する(添付ファイルもあわせて削除)。成功時true
async function deleteReportById(id){
  if(!window.fb) return false;
  const r = findReport(id);
  if(r && !isMine(r)){ toast('受け取ったレポートは削除できません'); return false; }
  try{
    await window.fb.deleteDoc(window.fb.doc(window.fb.db,'reports', id));
    // 再編集版と元レポートは同じ画像を共有しているので、他のレポートが使っていない画像だけを消す
    if(r && r.attachments && r.attachments.length){
      await deleteUnreferencedAttachments(r.attachments.map(a=>a.path), id);
    }
    return true;
  }catch(e){
    console.error(e);
    toast('削除に失敗しました(' + (e.code || e.message) + ')');
    return false;
  }
}

  await go('home');
}

  if(r.status==='sent'){

    S.draft = {...r, id:null, originalId: r.id, status:'draft', fields:(r.fields||[]).map(f=>({...f})), recipients:[], comments:[]};

    S.draft = {...r, fields:(r.fields||[]).map(f=>({...f})), recipients:[], comments:[]};
  }

  S.aiDraft = { loading:false, result:null, error:'' };
  S.screen='create';
  render();
}

function toggleRecipient(id){
  const i = S.sendSelected.indexOf(id);
  const max = currentPlan().maxRecipients;
  if(i===-1 && S.sendSelected.length >= max){ toast(limitMessage(`一度に送信できるのは${max}名までです`, 'maxRecipients')); return; }
  if(i>-1) S.sendSelected.splice(i,1); else S.sendSelected.push(id);
  render();
}
async function doSend(){
  if(!S.sendSelected.length){ toast('送信先を選択してください'); return; }
  if(S.sendSelected.length > currentPlan().maxRecipients){ toast(limitMessage(`一度に送信できるのは${currentPlan().maxRecipients}名までです`, 'maxRecipients')); return; }
  const btn = document.getElementById('send-submit-btn');
  const originalLabel = btn ? btn.textContent : null;
  if(btn){ btn.textContent = '送信中…'; btn.disabled = true; }

  const d = S.draft;
  const prevStatus = d.status, prevRecipients = d.recipients;
  d.status = 'sent';
  d.recipients = S.sendSelected.map(id=>({id, read:false}));
  const ok = await persistDraft(d);

  if(!ok){
    // 失敗した場合は元の状態に戻し、この画面に留まって再送信できるようにする(入力内容は失わない)
    d.status = prevStatus;
    d.recipients = prevRecipients;
    if(btn){ btn.textContent = originalLabel; btn.disabled = false; }
    return;
  }
  toast(d.originalId ? '新しいレポートとして送信しました' : '送信しました');
  S.draft = null;
  S.aiDraft = { loading:false, result:null, error:'' };
  S.filterStatus = 'all';
  await go('saved');
}

  if(S._contactsFrom==='send' && S.draft){ S._contactsFrom=null; S.screen='send'; render(); return; }
  S._contactsFrom=null;
  go('home');
}

  S.screen='contacts';

}

function switchRow(key,label,sub){
  const on = S.notif[key];
  return `<div class="set-row">

function toggleNotif(key){ S.notif[key] = !S.notif[key]; render(); }
async function addMyContact(idArg){
  const id = (idArg || S.addContactInput || '').trim().toUpperCase();
  if(!id){ toast('個人IDを入力してください'); return; }
  const c = DIRECTORY.find(x=>String(x.id||'').toUpperCase()===id);
  if(!c){ toast('その個人IDは見つかりませんでした。氏名で検索して候補から選ぶこともできます'); return; }
  if(S.myContacts.includes(c.id)){ toast('すでに追加されています'); return; }
  if(S.myContacts.length >= 200){ toast('登録できるのは200名までです'); return; }
  try{
    await window.fb.updateDoc(window.fb.doc(window.fb.db,'users',ME.uid), { favoriteIds: window.fb.arrayUnion(c.id) });
    S.myContacts.push(c.id);
    if(S.screen==='contacts') S.addContactInput='';
    toast((c.name||c.id)+'さんを追加しました');
    render();
  }catch(e){ console.error(e); toast('追加に失敗しました'); }
}
async function removeMyContact(id){
  const c = DIRECTORY.find(x=>x.id===id);
  if(!window.confirm(`${c?c.name:id}さんを相手一覧から削除しますか?\n(相手には通知されません。送信済みのレポートはそのまま残ります)`)) return;
  await removeContacts([id]);
}
async function removeSelectedContacts(){
  const ids = [...S.contactSelected];
  if(!ids.length){ toast('削除する相手を選択してください'); return; }
  if(!window.confirm(`${ids.length}名を相手一覧から削除しますか?\n(相手には通知されません。送信済みのレポートはそのまま残ります)`)) return;
  const ok = await removeContacts(ids);
  if(ok){ S.contactEditMode = false; S.contactSelected = []; render(); }
}
async function removeContacts(ids){
  try{
    await window.fb.updateDoc(window.fb.doc(window.fb.db,'users',ME.uid), { favoriteIds: window.fb.arrayRemove(...ids) });
    S.myContacts = S.myContacts.filter(x=>!ids.includes(x));
    S.contactSelected = S.contactSelected.filter(x=>!ids.includes(x));
    toast(ids.length===1 ? '削除しました' : ids.length+'名を削除しました');
    render();
    return true;
  }catch(e){ console.error(e); toast('削除に失敗しました'); return false; }
}
// 送信画面の検索結果から、相手一覧への登録・解除を切り替える
async function toggleFavoriteFromSend(id){
  if(S.myContacts.includes(id)){
    if(!window.confirm('相手一覧から削除しますか?')) return;
    await removeContacts([id]);
  } else {
    await addMyContact(id);
  }
}

/* ---- utils ---- */
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
// onclick="fn(${jsArg(x)})" のように、HTML属性内のJS引数として安全に埋め込む
function jsArg(s){ return escapeHtml(JSON.stringify(String(s==null?'':s))); }
// 添付画像のURLは Firebase Storage のものだけを許可する(javascript: などを埋め込まれないように)
function safeUrl(u){
  const s = String(u||'');
  return s.startsWith('https://firebasestorage.googleapis.com/') ? escapeHtml(s) : '';
}
function isMine(r){ return !!r && r.authorUid===ME.uid; }
// このStorageパスを、指定したレポート以外がまだ参照しているか(再編集版と元レポートで画像を共有しているため)
function isPathReferenced(path, exceptId){
  return reports.some(r=>r.id!==exceptId && (r.attachments||[]).some(a=>a.path===path));
}

function buildPrintDocumentHTML(d, mode){
  // 受け取ったレポートを印刷するときは、自分ではなく作成者の名前を載せる
  const authorLabel = (d.authorUid && d.authorUid!==ME.uid)
    ? `${escapeHtml(d.authorName)}(${escapeHtml(d.authorId)})`
    : `${escapeHtml(ME.name)}(${escapeHtml(ME.occupation)}・${escapeHtml(ME.id)})`;
  const fieldsHtml = (d.fields||[]).map(f=>`<div class="field"><div class="n">${escapeHtml(f.name||'項目')}</div><div class="v">${escapeHtml(f.value)}</div></div>`).join('');
  const questionHtml = d.question ? `<div class="field"><div class="n" style="color:#C4842B;">疑問・困りごと</div><div class="v">${escapeHtml(d.question)}</div></div>` : '';
  const imgsHtml = (d.attachments && d.attachments.length) ? `<div class="imgs">${d.attachments.filter(a=>safeUrl(a.url)).map(a=>`<img src="${safeUrl(a.url)}">`).join('')}</div>` : '';
  const isPdf = mode==='pdf';
  return `<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<title>${escapeHtml(d.title||'レポート')}</title>
<style>
  *{box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Segoe UI",sans-serif; color:#16232B; margin:0;}
  .toolbar{
    position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:10px;
    background:#0D47A1; color:#fff; padding:12px 16px;
  }
  .toolbar button{
    border:none; border-radius:999px; padding:9px 16px; font-size:13.5px; font-weight:700; cursor:pointer;
  }
  .toolbar .back{background:rgba(255,255,255,.16); color:#fff;}
  .toolbar .action{background:#fff; color:#0D47A1; margin-left:auto;}
  .toolbar .ttl{font-size:13.5px; font-weight:700; opacity:.9;}
  .hint{background:#FBF0DE; color:#7A5A16; font-size:12.5px; padding:10px 16px; line-height:1.6;}
  .page{padding:26px 30px; font-size:13px; line-height:1.9;}
  h1{font-size:19px; margin:0 0 4px; font-weight:800;}
  .meta{font-size:11px; color:#555; margin-bottom:18px; padding-bottom:10px; border-bottom:1px solid #ccc;}
  .body{white-space:pre-wrap; font-size:12.5px;}
  .field{margin-top:14px; page-break-inside:avoid;}
  .field .n{font-size:11px; font-weight:700; color:#1565C0;}
  .field .v{font-size:12.5px; margin-top:2px; white-space:pre-wrap;}
  .imgs{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px;}
  .imgs img{width:150px; height:150px; object-fit:cover; border-radius:6px; border:1px solid #ddd;}
  @media print{
    .toolbar, .hint{ display:none !important; }
    @page{ margin:16mm 14mm; }
  }
</style></head>
<body>
  <div class="toolbar">
    <button class="back" onclick="window.close()">← 戻る</button>
    <span class="ttl">印刷プレビュー</span>
    <button class="action" onclick="window.print()">🖨 印刷・PDF保存</button>
  </div>
  ${isPdf ? `<div class="hint">「🖨 印刷・PDF保存」を押すと印刷ダイアログが開きます。PDFにしたい場合は、送信先(プリンター)で「PDFに保存」を選んでください。</div>` : ''}
  <div class="page">
    <h1>${escapeHtml(d.title||'(無題のレポート)')}</h1>
    <div class="meta">作成者:${authorLabel} ／ ${escapeHtml(d.createdAt||'本日')}</div>
    <div class="body">${escapeHtml(d.body||'')}</div>
    ${imgsHtml}
    ${fieldsHtml}
    ${questionHtml}
  </div>
</body></html>`;
}

function openPrintWindow(d, mode){
  if(!d.title || !d.body){ toast('タイトルと本文は必須です'); return; }
  const html = buildPrintDocumentHTML(d, mode);
  const win = window.open('', '_blank');
  if(!win){
    toast('ポップアップがブロックされました。ブラウザの設定でこのサイトのポップアップを許可してください');
    return;
  }
  win.document.open();
  win.document.write(html);
  win.document.close();
  // プレビューを開き、上の「印刷・PDF保存」ボタンで印刷ダイアログを開く(PDFもそこから保存できる)
  toast('別タブでプレビューを開きました。上の「← 戻る」でこのアプリに戻れます');
}

let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  // Chrome / Edge / Android では、ブラウザ標準のインストール案内をこちらのボタンから出す
  e.preventDefault();
  deferredInstallPrompt = e;
});
window.addEventListener('appinstalled', ()=>{ deferredInstallPrompt = null; toast('インストールしました'); });
async function installApp(){
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    try{ await deferredInstallPrompt.userChoice; }catch(e){}
    deferredInstallPrompt = null;
    return;
  }
  if(IS_IOS){
    alert('iPhone / iPad の場合:\n\nSafariの画面下(または上)にある「共有」ボタン(□に↑)を押し、\n「ホーム画面に追加」を選んでください。');
  } else {
    alert('ブラウザのメニュー(︙ や …)から「アプリをインストール」または「ホーム画面に追加」を選んでください。\n\n表示されない場合は、Chrome または Edge で開いてお試しください。');
  }
}
if('serviceWorker' in navigator && location.protocol==='https:'){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(e=>console.error(e)); });
}

render();

// Firebase の準備ができたら、ログイン状態を確認して画面を切り替える
window.addEventListener('fb-ready', function(){
  window.fb.onAuthStateChanged(window.fb.auth, async function(user){
    if(authInProgress) return; // ログイン・登録処理の側で画面遷移まで面倒を見る
    if(user){
      await loadProfileAndApply(user);
      if(S.screen==='login'){ await go('home'); } else { render(); }
    } else {
      stopReportsListener();
      S.screen='login';
      render();
    }
  });
});
