<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6e99">
<title>専用タイマー(CPA記録) | 医療サポートツール</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
  <a class="back-btn" href="index.html" aria-label="戻る">‹</a>
  <h1>専用タイマー(CPA記録)</h1>
</header>

<main>
  <div class="card">
    <div class="timer-display">
      <div class="time" id="timer-time">00:00</div>
      <div class="started-at" id="timer-started-at">未開始</div>
    </div>

    <div class="timer-controls">
      <button id="btn-start-pause">開始</button>
      <button id="btn-reset">リセット</button>
    </div>

    <div class="alert-banner rhythm" id="alert-rhythm">🔴 リズムチェックの時間です(2分経過)</div>
    <div class="alert-banner epi" id="alert-epi">🟠 アドレナリン投与を検討してください</div>
  </div>

  <div class="card">
    <h2>イベント記録</h2>
    <div class="event-grid">
      <button class="event-btn" data-label="CPR開始" data-emoji="🫀">
        <span class="emoji">🫀</span>CPR開始
      </button>
      <button class="event-btn" data-label="気道確保" data-emoji="🌬️">
        <span class="emoji">🌬️</span>気道確保
      </button>
      <button class="event-btn" data-label="アドレナリン投与" data-emoji="💉" id="btn-epi">
        <span class="emoji">💉</span>アドレナリン投与
      </button>
      <button class="event-btn" data-label="除細動(電気ショック)" data-emoji="⚡" id="btn-shock">
        <span class="emoji">⚡</span>除細動(ショック)
      </button>
      <button class="event-btn" data-label="リズムチェック" data-emoji="📈" id="btn-rhythm">
        <span class="emoji">📈</span>リズムチェック
      </button>
      <button class="event-btn" data-label="静脈路確保" data-emoji="🩸">
        <span class="emoji">🩸</span>静脈路確保
      </button>
      <button class="event-btn rosc" data-label="ROSC(自己心拍再開)" data-emoji="✅">
        <span class="emoji">✅</span>ROSC(自己心拍再開)
      </button>
      <button class="event-btn end" data-label="CPA対応終了" data-emoji="🏁">
        <span class="emoji">🏁</span>CPA対応終了
      </button>
    </div>
  </div>

  <div class="card">
    <h2>記録ログ</h2>
    <div class="log-list" id="log-list">
      <div class="empty-log">まだ記録がありません</div>
    </div>
    <div class="log-actions">
      <button class="btn-secondary" id="btn-copy-log">📋 ログをコピー</button>
      <button class="btn-secondary" id="btn-clear-log">🗑 全て削除</button>
    </div>
  </div>
</main>

<script src="js/timer.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
