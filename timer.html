<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6e99">
<title>タイマー | 医療サポートツール</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
  <a class="back-btn" href="index.html" aria-label="戻る">‹</a>
  <h1>タイマー</h1>
</header>

<main>
  <div class="tabs">
    <button class="tab-btn active" data-tab="countdown">タイマー</button>
    <button class="tab-btn" data-tab="stopwatch">ストップウォッチ</button>
    <button class="tab-btn" data-tab="cpa">CPA記録</button>
  </div>

  <!-- カウントダウンタイマー -->
  <section id="tab-countdown" class="tab-panel active">
    <div class="card">
      <div class="timer-display" id="countdown-display">
        <div class="time" id="countdown-time">00:00</div>
      </div>

      <div class="alert-banner rhythm" id="countdown-finished-banner">⏰ 設定時間になりました</div>

      <label>時間を設定</label>
      <div class="field-row">
        <div><input type="number" id="countdown-h" inputmode="numeric" placeholder="時" min="0"></div>
        <div><input type="number" id="countdown-m" inputmode="numeric" placeholder="分" min="0" max="59"></div>
        <div><input type="number" id="countdown-s" inputmode="numeric" placeholder="秒" min="0" max="59"></div>
      </div>

      <label>クイック選択</label>
      <div class="preset-grid">
        <button class="preset-btn" data-sec="60" type="button">1分</button>
        <button class="preset-btn" data-sec="180" type="button">3分</button>
        <button class="preset-btn" data-sec="300" type="button">5分</button>
        <button class="preset-btn" data-sec="600" type="button">10分</button>
      </div>

      <div class="timer-controls">
        <button id="countdown-start-pause">開始</button>
        <button id="countdown-reset">リセット</button>
      </div>

      <label for="preset-name-input">名前を付けて保存</label>
      <input type="text" id="preset-name-input" placeholder="例: ネブライザー吸入" autocomplete="off">
      <button class="btn-secondary" id="save-preset-btn" type="button" style="width:100%; margin-top:10px;">💾 この時間を保存</button>
      <div class="preset-msg" id="preset-msg"></div>
    </div>

    <div class="card">
      <h2>保存したタイマー</h2>
      <div class="log-list" id="saved-preset-list">
        <div class="empty-log">保存したタイマーはありません</div>
      </div>
    </div>
  </section>

  <!-- ストップウォッチ -->
  <section id="tab-stopwatch" class="tab-panel">
    <div class="card">
      <div class="timer-display">
        <div class="time" id="stopwatch-time">00:00</div>
      </div>
      <div class="timer-controls">
        <button id="stopwatch-start-pause">開始</button>
        <button id="stopwatch-reset">リセット</button>
      </div>
      <button class="btn-secondary" id="stopwatch-lap" type="button" style="width:100%; margin-top:10px;">🏁 ラップを記録</button>
    </div>

    <div class="card">
      <h2>ラップ記録</h2>
      <div class="log-list" id="lap-list">
        <div class="empty-log">まだラップがありません</div>
      </div>
    </div>
  </section>

  <!-- CPA記録タイマー -->
  <section id="tab-cpa" class="tab-panel cpa-compact">
    <div class="card cpa-cycles-card">
      <div class="cpa-cycle">
        <h2>🔴 リズムチェック<span class="cpa-cycle-period">2分</span></h2>
        <div class="time cpa-cycle-time-sm" id="rhythm-cycle-time">02:00</div>
        <div class="cycle-controls">
          <button class="cycle-start-pause" id="rhythm-start-pause">開始</button>
          <button class="cycle-reset" id="rhythm-reset">リセット</button>
        </div>
      </div>
      <div class="cpa-cycle">
        <h2>🟠 薬剤投与<span class="cpa-cycle-period">4分</span></h2>
        <div class="time cpa-cycle-time-sm" id="med-cycle-time">04:00</div>
        <div class="cycle-controls">
          <button class="cycle-start-pause" id="med-start-pause">開始</button>
          <button class="cycle-reset" id="med-reset">リセット</button>
        </div>
      </div>
    </div>
    <div class="alert-banner rhythm" id="alert-rhythm">🔴 リズムチェックの時間です(開始で圧迫音も再生)</div>
    <div class="alert-banner epi" id="alert-epi">🟠 薬剤投与の時間です</div>

    <div class="card">
      <h2>イベント記録</h2>
      <div class="event-grid">
        <div class="event-btn med-btn-wrap">
          <span class="emoji">〰️</span>波形
          <select id="rhythm-wave-select" class="med-select-overlay" aria-label="波形を選択">
            <option value="" disabled selected hidden>波形を選択</option>
            <option value="VF">VF(心室細動)</option>
            <option value="VT">VT(心室頻拍)</option>
            <option value="PEA">PEA(無脈性電気活動)</option>
            <option value="心静止">心静止</option>
          </select>
        </div>
        <div class="event-btn med-btn-wrap">
          <span class="emoji">🌬️</span>気管挿管
          <select id="ett-size-select" class="med-select-overlay" aria-label="チューブサイズを選択">
            <option value="" disabled selected hidden>サイズを選択</option>
            <option value="6.0mm">6.0mm</option>
            <option value="6.5mm">6.5mm</option>
            <option value="7.0mm">7.0mm</option>
            <option value="7.5mm">7.5mm</option>
            <option value="8.0mm">8.0mm</option>
          </select>
        </div>
        <button class="event-btn" data-label="除細動(電気ショック)" data-emoji="⚡" id="btn-shock">
          <span class="emoji">⚡</span>除細動(ショック)
        </button>
        <button class="event-btn" data-label="ROSC(自己心拍再開)" data-emoji="✅" id="btn-rosc">
          <span class="emoji">✅</span>ROSC
        </button>
        <button class="event-btn" data-label="静脈路確保" data-emoji="🩸">
          <span class="emoji">🩸</span>静脈路確保
        </button>
        <div class="event-btn med-btn-wrap">
          <span class="emoji">💉</span>薬剤投与
          <select id="med-drug-select" class="med-select-overlay" aria-label="薬剤を選択">
            <option value="" disabled selected hidden>薬剤を選択</option>
            <option value="アドレナリン">アドレナリン</option>
            <option value="アミオダロン">アミオダロン</option>
            <option value="リドカイン">リドカイン</option>
          </select>
        </div>
        <button class="event-btn end" data-label="CPA対応終了" data-emoji="🏁">
          <span class="emoji">🏁</span>CPA対応終了
        </button>
      </div>
    </div>

    <div class="card">
      <div class="note-row">
        <input type="text" id="note-input" placeholder="メモ入力 例: 家族到着 など" autocomplete="off">
        <button class="mic-btn" id="btn-mic" type="button" aria-label="音声入力">🎤</button>
        <button class="btn-primary cpa-note-add" id="btn-add-note" type="button">追加</button>
      </div>
      <div class="voice-hint" id="voice-hint">🎤で音声入力(話すと自動追加)</div>

      <div class="log-list" id="log-list">
        <div class="empty-log">まだ記録がありません</div>
      </div>
      <div class="log-actions">
        <button class="btn-secondary" id="btn-toggle-log">🔍 全表示</button>
        <button class="btn-secondary" id="btn-copy-log">📋 コピー</button>
        <button class="btn-secondary" id="btn-clear-log">🗑 削除</button>
      </div>
    </div>
  </section>
</main>

<script src="js/audio-unlock.js"></script>
<script src="js/timer.js"></script>
<script src="js/general-timer.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
