name: Project YUI のテスト

# 型チェック・テスト・ビルドが通ること、公開用の app/ がソースから作り直されていることを確かめる

on:
  push:
    paths:
      - 'yui/**'
      - '.github/workflows/yui-test.yml'
  pull_request:
    paths:
      - 'yui/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: app/ が最新か
        run: git diff --exit-code --stat -- app || (echo "yui/ で npm run build して app/ もコミットしてください" && exit 1)
