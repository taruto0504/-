name: Project YUI のテスト

# 型チェック・テスト・ビルドが通ることを確かめる

on:
  push:
    paths:
      - 'yui/**'
      - '.github/workflows/yui-test.yml'
  pull_request:
    paths:
      - 'yui/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
