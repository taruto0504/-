name: 薬価基準にない薬の一覧の作成

# scripts/build-extra-list.py で、薬価基準に載っていない医療用医薬品(ワクチンなど)の製剤一覧を
# KEGG MEDICUS から作り、extra-list ブランチに保存する。アプリ用の js/drug-list-extra.js への変換は
# scripts/build-extra-list.py --js で行う。

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-extra-list.yml'
      - 'scripts/build-extra-list.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - run: pip install beautifulsoup4 lxml

      - name: 一覧を作る
        run: |
          mkdir out
          python3 scripts/build-extra-list.py --out out/drug-list-extra.json --delay 1.0

      - name: extra-list ブランチに保存
        working-directory: out
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q
          git checkout -q -b extra-list
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "薬価基準にない薬の一覧 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" extra-list
