name: 薬価基準データの取得

# 厚生労働省「薬価基準収載品目リスト」(Excel)と薬効分類表(PDF)をダウンロードし、
# source-data ブランチに保存する。アプリ用データへの変換は scripts/build-drug-list.py で行う。
# 薬価改定のときは YAKKA_PAGE を新しいページのURLに変えて実行する。

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fetch-drug-sources.yml'

permissions:
  contents: write

env:
  YAKKA_PAGE: https://www.mhlw.go.jp/topics/2026/04/tp20260401-01.html
  CLASS_PDF: https://www.mhlw.go.jp/content/11120000/001666688.pdf

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ダウンロード
        run: |
          mkdir out && cd out
          curl -fsSL -A "Mozilla/5.0" "$YAKKA_PAGE" -o page.html
          python3 - <<'EOF'
          import os, re, urllib.parse
          page = os.environ["YAKKA_PAGE"]
          html = open("page.html", encoding="utf-8", errors="replace").read()
          links = sorted({urllib.parse.urljoin(page, h) for h in re.findall(r'href="([^"]+\.xlsx?)"', html)})
          open("links.txt", "w").write("\n".join(links) + "\n")
          EOF
          cat links.txt
          mkdir xlsx
          while read -r url; do
            [ -n "$url" ] && curl -fsSL -A "Mozilla/5.0" "$url" -o "xlsx/$(basename "$url")"
          done < links.txt
          curl -fsSL -A "Mozilla/5.0" "$CLASS_PDF" -o class.pdf
          echo "$YAKKA_PAGE" > source.txt
          date -u +%Y-%m-%dT%H:%M:%SZ > fetched_at.txt
          ls -la . xlsx

      - name: source-data ブランチに保存
        working-directory: out
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q
          git checkout -q -b source-data
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "薬価基準データ取得 $(cat fetched_at.txt)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" source-data
