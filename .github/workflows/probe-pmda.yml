name: PMDA ページ構造の確認

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-pmda.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取得
        run: |
          mkdir out && cd out
          UA="Mozilla/5.0 (medical-support-tool data check)"
          curl -sSL -A "$UA" "https://www.pmda.go.jp/PmdaSearch/iyakuDetail/112268_1119402A1022_2_07" -o propofol.html
          sleep 2
          curl -sSL -A "$UA" "https://www.pmda.go.jp/PmdaSearch/iyakuDetail/GeneralList/2171022" -o amlo-general.html
          sleep 2
          id=$(grep -oE 'detailDisp\("PmdaSearch", "[^"]+"' amlo-general.html | head -1 | sed 's/.*", "//;s/"$//')
          echo "$id" > amlo-id.txt
          curl -sSL -A "$UA" "https://www.pmda.go.jp/PmdaSearch/iyakuDetail/$id" -o amlo.html
          ls -la

      - name: pmda-probe ブランチに保存
        working-directory: out
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q
          git checkout -q -b pmda-probe
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "probe"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pmda-probe
