name: PMDA 検索ページの調査

# 添付文書を取り込めなかった製剤を製品名で探す方法を調べるため、PMDA の検索ページを保存する(調査用、あとで消す)

on:
  push:
    paths:
      - '.github/workflows/pmda-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取得
        run: |
          mkdir out && cd out
          UA="medical-support-tool/1.0 (+https://github.com/taruto0504/-)"
          J=cookies.txt
          K="https://www.kegg.jp/medicus-bin"
          curl -sSL -A "$UA" "$K/japic_med?japic_code=00071900" -o kegg-med-imlurio.html
          curl -sSL -A "$UA" "$K/japic_med?japic_code=00045616" -o kegg-med-perdipine.html
          for q in イエスカルタ インドメタシンカプセル オマリズマブBS アヘンアルカロイド・アトロピン注射液 イオタラム酸; do
            curl -sSL -A "$UA" -G "$K/search_drug" --data-urlencode "display=med" --data-urlencode "search_keyword=$q" -o "kegg-search-$q.html"
            sleep 1
          done
          ls -la
      - name: pmda-probe ブランチに保存
        working-directory: out
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f cookies.txt
          git init -q && git checkout -q -b pmda-probe && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "PMDA 検索ページの調査"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pmda-probe
