name: LabSight build

on:
  push:
    paths:
      - 'labsight/**'
      - '.github/workflows/labsight-build.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: labsight

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: LabSight-android-apk
          path: labsight/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  ios:
    name: iOS (署名なしビルド)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: 署名なし IPA を作成
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -qr LabSight-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: LabSight-ios-unsigned
          path: labsight/build/ipa/LabSight-unsigned.ipa
          retention-days: 30
